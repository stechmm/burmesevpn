version: "3.8"

services:
  vpn-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wireguard-router-hub
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./data:/app/data
      - ./wireguard-conf:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"   # WireGuard VPN Port
      - "8080:8080"         # Web Admin Management Dashboard
    environment:
      - WG_SERVER_ENDPOINT=YOUR_SERVER_PUBLIC_IP
      - PORT=8080
      - HOST=0.0.0.0
