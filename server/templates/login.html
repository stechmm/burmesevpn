<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burmese VPN — Admin Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Padauk", "Pyidaungsu"; }
    body { background-color: #090d14; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-container { width: 100%; max-width: 420px; }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-icon { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #3b82f6, #6366f1); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); border: 1px solid rgba(255,255,255,0.2); }
    .brand-title { font-size: 24px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .login-card { background-color: #111722; border: 1px solid #233044; border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .card-header { border-bottom: 1px solid #233044; padding-bottom: 16px; margin-bottom: 20px; }
    .card-title { font-size: 14px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .error-box { background: rgba(225, 29, 72, 0.2); border: 1px solid rgba(225, 29, 72, 0.4); color: #fda4af; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .form-input { width: 100%; padding: 12px 14px; background: #090d14; border: 1px solid #233044; border-radius: 12px; color: #ffffff; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .info-box { background: #090d14; border: 1px solid #233044; border-radius: 12px; padding: 10px 14px; font-size: 11px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .info-badge { font-family: monospace; color: #60a5fa; font-weight: 700; font-size: 12px; }
    .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: #ffffff; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:active { transform: scale(0.98); }
    .footer-text { text-align: center; font-size: 11px; color: #64748b; margin-top: 24px; }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="brand-header">
      <div class="brand-icon">🛡️</div>
      <h1 class="brand-title">Burmese VPN</h1>
      <p class="brand-subtitle">Dual-Engine Enterprise Management Portal</p>
    </div>

    <div class="login-card">
      
      <div class="card-header">
        <h2 class="card-title">🔒 Administrator Sign In</h2>
        <p class="card-desc">ဆာဗာအား စီမံခန့်ခွဲရန် လော့ဂ်အင် ဝင်ရောက်ပါ</p>
      </div>

      {% if error %}
      <div class="error-box">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST">
        
        <div class="form-group">
          <label class="form-label">Username (အသုံးပြုသူအမည်)</label>
          <div class="input-wrapper">
            <input type="text" name="username" required value="admin" class="form-input" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password (စကားဝှက်)</label>
          <div class="input-wrapper">
            <input type="password" name="password" required value="password" class="form-input" autocomplete="current-password">
          </div>
        </div>

        <div class="info-box">
          <span>Default Login:</span>
          <span class="info-badge">admin / password</span>
        </div>

        <button type="submit" class="btn-submit">
          <span>Sign In to Dashboard →</span>
        </button>

      </form>

    </div>

    <div class="footer-text">
      🇲🇲 Burmese VPN Dual-Engine Hub • Protected Access
    </div>

  </div>

</body>
</html>
