<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burmese VPN — Admin Sign In</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Typography: Plus Jakarta Sans & Padauk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Padauk:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Padauk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            app: {
              bg: '#090d14',
              surface: '#111722',
              card: '#161f2e',
              border: '#233044',
              accent: '#3b82f6',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090d14;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white antialiased">

  <div class="w-full max-w-md space-y-6">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2.5">
      <div class="inline-flex w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 items-center justify-center shadow-xl shadow-blue-500/25 border border-blue-400/30 mb-2">
        <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">Burmese VPN</h1>
      <p class="text-xs text-slate-400 font-medium">Dual-Engine Enterprise Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="bg-app-surface border border-app-border rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <div class="border-b border-app-border pb-4">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="lock" class="w-4 h-4 text-blue-400"></i>
          <span>Administrator Sign In</span>
        </h2>
        <p class="text-[11px] text-slate-400 mt-1">ဆာဗာအား စီမံခန့်ခွဲရန် လော့ဂ်အင် ဝင်ရောက်ပါ</p>
      </div>

      {% if error %}
      <div class="p-3.5 rounded-xl bg-rose-950/80 border border-rose-700/60 text-rose-300 text-xs font-semibold flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4">
        
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Username (အသုံးပြုသူအမည်)</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" name="username" required value="admin" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-app-bg border border-app-border text-white text-xs focus:border-blue-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Password (စကားဝှက်)</label>
          <div class="relative">
            <i data-lucide="key" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" name="password" required value="password" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-app-bg border border-app-border text-white text-xs focus:border-blue-500 focus:outline-none transition">
          </div>
        </div>

        <div class="p-3 rounded-xl bg-app-bg border border-app-border text-[11px] text-slate-400 flex items-center justify-between">
          <span>Default Credentials:</span>
          <span class="font-mono text-blue-400 font-bold">admin / password</span>
        </div>

        <button type="submit" class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 active:scale-95">
          <span>Sign In to Dashboard</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

      </form>

    </div>

    <!-- Footer -->
    <div class="text-center text-[11px] text-slate-500">
      🇲🇲 Burmese VPN Dual-Engine Hub • Protected Access
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
